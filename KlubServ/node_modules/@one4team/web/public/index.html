<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One4Team - Sports Club Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }
        
        h1 {
            font-size: 3rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 1rem;
            line-height: 1.2;
        }
        
        .blue-text {
            color: #2563eb;
        }
        
        p {
            font-size: 1.25rem;
            color: #6b7280;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }
        
        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn-primary {
            background-color: #2563eb;
            color: white;
            padding: 0.875rem 1.75rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
        }
        
        .btn-primary:hover {
            background-color: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }
        
        .btn-secondary {
            border: 2px solid #d1d5db;
            color: #374151;
            padding: 0.875rem 1.75rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s ease;
            background-color: white;
            cursor: pointer;
        }
        
        .btn-secondary:hover {
            border-color: #9ca3af;
            background-color: #f9fafb;
            transform: translateY(-1px);
        }
        
        @media (max-width: 640px) {
            h1 {
                font-size: 2.5rem;
            }
            
            p {
                font-size: 1.125rem;
            }
            
            .buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .btn-primary, .btn-secondary {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to One<span class="blue-text">4</span>Team</h1>
        <p>The <span class="blue-text">smart</span> platform for sports clubs</p>
        <div class="buttons">
            <a href="/sign-up" class="btn-primary">Register Club</a>
            <a href="/sign-in" class="btn-secondary">Log In</a>
        </div>
    </div>
</body>
</html>
