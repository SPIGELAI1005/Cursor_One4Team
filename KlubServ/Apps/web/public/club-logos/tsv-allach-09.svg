<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle with green border -->
  <circle cx="24" cy="24" r="24" fill="#22C55E"/>
  
  <!-- Inner white circle -->
  <circle cx="24" cy="24" r="20" fill="white"/>
  
  <!-- Four-leaf clover -->
  <g fill="#22C55E">
    <!-- Top leaf -->
    <ellipse cx="24" cy="16" rx="6" ry="8" transform="rotate(0 24 16)"/>
    <!-- Bottom leaf -->
    <ellipse cx="24" cy="32" rx="6" ry="8" transform="rotate(0 24 32)"/>
    <!-- Left leaf -->
    <ellipse cx="16" cy="24" rx="8" ry="6" transform="rotate(0 16 24)"/>
    <!-- Right leaf -->
    <ellipse cx="32" cy="24" rx="8" ry="6" transform="rotate(0 32 24)"/>
  </g>
  
  <!-- TSV text in center -->
  <text x="24" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">T</text>
  <text x="24" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="white">S</text>
  <text x="24" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white">V</text>
  
  <!-- 19 and 09 numbers -->
  <text x="18" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#22C55E">19</text>
  <text x="30" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#22C55E">09</text>
</svg>
