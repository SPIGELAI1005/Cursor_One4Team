<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Shield shape with golden border -->
  <path d="M24 4 L44 12 L44 36 L24 44 L4 36 L4 12 Z" fill="white" stroke="#D4AF37" stroke-width="2"/>
  
  <!-- Red left half -->
  <path d="M24 8 L24 40 L4 32 L4 16 Z" fill="#DC2626"/>
  
  <!-- White right half -->
  <path d="M24 8 L44 16 L44 32 L24 40 Z" fill="white"/>
  
  <!-- FCA text at top -->
  <text x="24" y="16" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#DC2626">FCA</text>
  
  <!-- Italian flag stripes -->
  <rect x="20" y="18" width="8" height="2" fill="#22C55E"/>
  <rect x="20" y="20" width="8" height="2" fill="white"/>
  <rect x="20" y="22" width="8" height="2" fill="#DC2626"/>
  
  <!-- Pinecone in center -->
  <g transform="translate(24, 30)">
    <!-- Pinecone body -->
    <ellipse cx="0" cy="0" rx="8" ry="12" fill="#22C55E"/>
    <!-- Pinecone scales -->
    <path d="M-6 -8 L6 -8 M-5 -4 L5 -4 M-4 0 L4 0 M-3 4 L3 4 M-2 8 L2 8" stroke="#166534" stroke-width="1"/>
    <path d="M-4 -6 L4 -6 M-3 -2 L3 -2 M-2 2 L2 2 M-1 6 L1 6" stroke="#166534" stroke-width="1"/>
  </g>
  
  <!-- 1907 at bottom -->
  <text x="24" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#DC2626">1907</text>
</svg>
