<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular border -->
  <circle cx="24" cy="24" r="23" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- Diagonal background split -->
  <defs>
    <clipPath id="diagonal-split">
      <path d="M 0 0 L 48 0 L 0 48 Z"/>
    </clipPath>
  </defs>
  
  <!-- White upper-left background -->
  <circle cx="24" cy="24" r="22" fill="white" clip-path="url(#diagonal-split)"/>
  
  <!-- Black lower-right background -->
  <circle cx="24" cy="24" r="22" fill="black" clip-path="url(#diagonal-split)" transform="rotate(180 24 24)"/>
  
  <!-- Stylized number "4" -->
  <g transform="translate(12, 8)">
    <!-- Blue upper-right part of "4" -->
    <path d="M 8 0 L 8 16 L 0 16 L 0 20 L 8 20 L 8 24 L 12 24 L 12 20 L 20 20 L 20 16 L 12 16 L 12 0 Z" fill="#0066CC"/>
    
    <!-- Black lower-left part of "4" -->
    <path d="M 0 16 L 8 16 L 8 20 L 12 20 L 12 24 L 16 24 L 16 20 L 20 20 L 20 16 L 16 16 L 16 0 L 12 0 L 12 16 Z" fill="black"/>
  </g>
</svg> 