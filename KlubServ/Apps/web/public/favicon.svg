<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Circular border -->
  <circle cx="16" cy="16" r="15" fill="none" stroke="black" stroke-width="1.5"/>
  
  <!-- Diagonal background split -->
  <defs>
    <clipPath id="diagonal-split-favicon">
      <path d="M 0 0 L 32 0 L 0 32 Z"/>
    </clipPath>
  </defs>
  
  <!-- White upper-left background -->
  <circle cx="16" cy="16" r="14.5" fill="white" clip-path="url(#diagonal-split-favicon)"/>
  
  <!-- Black lower-right background -->
  <circle cx="16" cy="16" r="14.5" fill="black" clip-path="url(#diagonal-split-favicon)" transform="rotate(180 16 16)"/>
  
  <!-- Stylized number "4" -->
  <g transform="translate(8, 5)">
    <!-- Blue upper-right part of "4" -->
    <path d="M 5 0 L 5 11 L 0 11 L 0 13 L 5 13 L 5 16 L 8 16 L 8 13 L 13 13 L 13 11 L 8 11 L 8 0 Z" fill="#0066CC"/>
    
    <!-- Black lower-left part of "4" -->
    <path d="M 0 11 L 5 11 L 5 13 L 8 13 L 8 16 L 11 16 L 11 13 L 13 13 L 13 11 L 11 11 L 11 0 L 8 0 L 8 11 Z" fill="black"/>
  </g>
</svg> 