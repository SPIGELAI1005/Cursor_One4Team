<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Recipe Recommender</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <h1 class="text-3xl font-bold text-center mb-8">Mood Recipe Recommender</h1>
        
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl mb-4">How are you feeling today?</h2>
            
            <div class="grid grid-cols-2 gap-4 mb-6">
                <button class="mood-btn bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600" data-mood="happy">
                    Happy 😊
                </button>
                <button class="mood-btn bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600" data-mood="sad">
                    Sad 😢
                </button>
                <button class="mood-btn bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600" data-mood="stressed">
                    Stressed 😰
                </button>
                <button class="mood-btn bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600" data-mood="energetic">
                    Energetic ⚡
                </button>
            </div>

            <div id="recipe-display" class="hidden">
                <div class="border-t pt-4">
                    <h3 class="text-xl font-bold mb-2">Recipes:</h3>
                    <ul id="recipe-list" class="list-disc pl-5"></ul>
                </div>
            </div>
        </div>
    </div>
    <script>
        const recipes = {
            happy: ["Recipe 1", "Recipe 2", "Recipe 3", "Recipe 4", "Recipe 5", "Recipe 6", "Recipe 7", "Recipe 8", "Recipe 9", "Recipe 10"],
            sad: ["Recipe 11", "Recipe 12", "Recipe 13", "Recipe 14", "Recipe 15", "Recipe 16", "Recipe 17", "Recipe 18", "Recipe 19", "Recipe 20"],
            stressed: ["Recipe 21", "Recipe 22", "Recipe 23", "Recipe 24", "Recipe 25", "Recipe 26", "Recipe 27", "Recipe 28", "Recipe 29", "Recipe 30"],
            energetic: ["Recipe 31", "Recipe 32", "Recipe 33", "Recipe 34", "Recipe 35", "Recipe 36", "Recipe 37", "Recipe 38", "Recipe 39", "Recipe 40"]
        };
    </script>
</body>
</html>
