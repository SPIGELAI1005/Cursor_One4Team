<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COXFE - Email Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Include the same logo styles as in login.html -->
    <style>
        /* Copy the logo styles from login.html */
    </style>
</head>
<body class="bg-[#00B4D8] min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4 py-8 max-w-md">
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <!-- Logo -->
            <div class="logo-container">
                <div class="logo-circle">
                    <div class="logo-top"></div>
                    <span class="logo-x">X</span>
                    <div class="logo-bottom"></div>
                </div>
            </div>
            
            <h1 class="text-3xl font-bold text-center mb-2">COXFE</h1>
            <p class="text-gray-600 text-center mb-8">Verify your email</p>
            
            <!-- Verification Form -->
            <form id="verifyForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700 mb-2" for="verificationCode">Verification Code</label>
                    <input type="text" id="verificationCode" name="verificationCode" required
                        class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#00B4D8]"
                        placeholder="Enter 6-digit code">
                </div>
                <button type="submit" 
                    class="w-full bg-[#00B4D8] text-white py-3 px-4 rounded-lg hover:bg-[#0096B4] transition duration-300">
                    Verify Email
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-gray-600">Didn't receive the code? 
                    <button id="resendCode" class="text-[#00B4D8] hover:text-[#0096B4] font-semibold">Resend</button>
                </p>
            </div>
        </div>
    </div>
    <script src="verify.js"></script>
</body>
</html>
