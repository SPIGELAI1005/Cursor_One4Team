<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COXFE - Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .logo-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 2rem;
            position: relative;
        }
        .logo-circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .logo-x {
            font-size: 2.5rem;
            font-weight: bold;
            color: #333;
            position: relative;
        }
        .logo-top {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 30px;
            background: #00B4D8;
            border-top-left-radius: 60px;
            border-top-right-radius: 60px;
        }
        .logo-bottom {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 30px;
            background: #8B4513;
            border-bottom-left-radius: 60px;
            border-bottom-right-radius: 60px;
        }
    </style>
</head>
<body class="bg-[#00B4D8] min-h-screen flex items-center justify-center">
    <div class="container mx-auto px-4 py-8 max-w-md">
        <div class="bg-white rounded-2xl shadow-xl p-8">
            <!-- Logo -->
            <div class="logo-container">
                <div class="logo-circle">
                    <div class="logo-top"></div>
                    <span class="logo-x">X</span>
                    <div class="logo-bottom"></div>
                </div>
            </div>
            
            <h1 class="text-3xl font-bold text-center mb-2">COXFE</h1>
            <p class="text-gray-600 text-center mb-8">Create your account</p>
            
            <!-- Registration Form -->
            <form id="registerForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700 mb-2" for="username">Username</label>
                    <input type="text" id="username" name="username" required
                        class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#00B4D8]">
                </div>
                <div>
                    <label class="block text-gray-700 mb-2" for="email">Email</label>
                    <input type="email" id="email" name="email" required
                        class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#00B4D8]">
                </div>
                <div>
                    <label class="block text-gray-700 mb-2" for="password">Password</label>
                    <input type="password" id="password" name="password" required
                        class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#00B4D8]">
                </div>
                <button type="submit" 
                    class="w-full bg-[#00B4D8] text-white py-3 px-4 rounded-lg hover:bg-[#0096B4] transition duration-300">
                    Register
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-gray-600">Already have an account? 
                    <a href="login.html" class="text-[#00B4D8] hover:text-[#0096B4] font-semibold">Login</a>
                </p>
            </div>
        </div>
    </div>
    <script src="register.js"></script>
</body>
</html>
