<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="AIzaSyD5CyGjuhSQULb39jIhsIM2CF_f84z84jc"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-center mb-8">Location Finder</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Sidebar -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <h2 class="text-xl mb-4">Filter Locations</h2>
                <select id="category-filter" class="w-full mb-4 p-2 border rounded">
                    <option value="">All Categories</option>
                    <option value="Park">Parks</option>
                    <option value="Restaurant">Restaurants</option>
                    <option value="Tourist Attraction">Tourist Attractions</option>
                </select>

                <div id="location-list" class="space-y-4">
                    <!-- Locations will be populated here -->
                </div>
            </div>

            <!-- Map -->
            <div class="md:col-span-2">
                <div id="map" class="w-full h-[600px] rounded-lg shadow-md"></div>
            </div>
        </div>

        <!-- Add Location Form -->
        <div class="mt-8 bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl mb-4">Add New Location</h2>
            <form id="add-location-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="name" placeholder="Location Name" class="p-2 border rounded" required>
                <select id="category" class="p-2 border rounded" required>
                    <option value="Park">Park</option>
                    <option value="Restaurant">Restaurant</option>
                    <option value="Tourist Attraction">Tourist Attraction</option>
                </select>
                <input type="number" id="latitude" placeholder="Latitude" class="p-2 border rounded" required>
                <input type="number" id="longitude" placeholder="Longitude" class="p-2 border rounded" required>
                <input type="text" id="address" placeholder="Address" class="p-2 border rounded" required>
                <textarea id="description" placeholder="Description" class="p-2 border rounded"></textarea>
                <button type="submit" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">
                    Add Location
                </button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
